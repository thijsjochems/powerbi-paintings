<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Power BI Embed</title>
  <script src="https://cdn.jsdelivr.net/npm/powerbi-client@2.19.1/dist/powerbi.min.js"></script>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
    }
    #reportContainer {
      width: 100%;
      height: 100vh;
    }
  </style>
</head>
<body>
  <div id="reportContainer"></div>

  <script>
    const embedUrl = "https://app.powerbi.com/view?r=eyJrIjoiZjMzYWNiMWEtMThkYS00NDM5LTg2YzYtZGY4N2IzYjlmNTE4IiwidCI6ImRiNGZmYjI0LTBmOTctNDBhZC04MTI4LTRmZjhmZDdkN2FhMyIsImMiOjl9";

    const reportContainer = document.getElementById("reportContainer");

    const models = window['powerbi-client'].models;

    const config = {
      type: 'report',
      embedUrl: embedUrl,
      tokenType: models.TokenType.Aad, // Gebruik Aad voor publieke embeds (of Embed als je een embed-token gebruikt)
      settings: {
        layoutType: models.LayoutType.FitToPage,
        panes: {
          filters: { visible: false },
          pageNavigation: { visible: true }
        }
      }
    };

    powerbi.embed(reportContainer, config);
  </script>
</body>
</html>
